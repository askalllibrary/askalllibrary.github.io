<!-- ASKALL V7.8.3 | Rak Kategori Buku Mini | Tempel satu kali sebelum </body> -->
<style id="askall-category-minibooks-v783-style">
/* Hanya bagian kategori beranda. Fitur ASKALL lainnya tetap menggunakan kode lama. */
body .category-grid{
  --askall-shelf-step:188px;
  display:grid!important;
  grid-template-columns:repeat(5,minmax(0,1fr))!important;
  align-items:end;
  justify-items:center;
  column-gap:12px!important;
  row-gap:30px!important;
  padding:13px 12px 24px;
  border-radius:18px;
  background-color:transparent;
  background-image:repeating-linear-gradient(to bottom,
    transparent 0px,transparent 170px,
    #e4e9dc 171px,#f6f6ed 174px,#d4ddcf 179px,
    rgba(76,105,81,.10) 181px,transparent 186px,transparent 188px);
  background-size:100% var(--askall-shelf-step);
}
body .category-grid .category-card{
  --askall-book-tint:#c9dccc;
  display:block!important;position:relative!important;isolation:isolate;
  width:min(100%,142px)!important;height:158px!important;
  min-height:0!important;padding:0!important;margin:0!important;
  border:0!important;border-radius:8px!important;
  background:transparent!important;overflow:visible!important;
  box-shadow:none!important;text-align:center!important;
  perspective:850px;transform:translateY(0);
  transition:transform .25s ease;
  -webkit-tap-highlight-color:transparent;
}
body .category-grid .category-card::after{content:none!important;display:none!important}
body .category-grid .category-card:hover:not(.is-opening),
body .category-grid .category-card:focus-visible:not(.is-opening){
  transform:translateY(-4px)!important;box-shadow:none!important;
}
body .category-grid .category-card:focus-visible{
  outline:2px solid #548b75;outline-offset:7px;
}
body .category-grid .category-card.is-opening{z-index:15;transform:translateY(-2px)!important}
body .category-grid .askall-book-cover,
body .category-grid .askall-book-page{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  border:1px solid #e3dfd2;border-radius:6px 10px 8px 5px;
}
body .category-grid .askall-book-cover{
  z-index:2;padding:13px 10px 12px 17px;
  background:linear-gradient(110deg,#f4f0e6 0%,#fffdf5 17%,#fffdf7 80%,#f3eee3 100%);
  box-shadow:5px 7px 13px rgba(46,76,58,.10),inset -2px 0 3px rgba(114,108,86,.06);
  transform-origin:0% 50%;transform-style:preserve-3d;
  backface-visibility:hidden;
  transition:transform .62s cubic-bezier(.22,.7,.17,1),box-shadow .3s;
}
body .category-grid .askall-book-cover::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:11px;
  border-radius:5px 0 0 5px;
  background:linear-gradient(90deg,rgba(45,75,54,.22),var(--askall-book-tint) 45%,rgba(255,255,255,.35));
  border-right:1px solid rgba(54,82,61,.09);
}
body .category-grid .askall-book-cover::after{
  content:"";position:absolute;inset:8px 8px 8px 17px;
  border:1px solid rgba(130,155,128,.20);border-radius:4px 9px 6px 3px;
  pointer-events:none;
}
body .category-grid .askall-book-page{
  z-index:1;padding:12px 10px;
  background:repeating-linear-gradient(180deg,#fbf9f0 0px,#fbf9f0 17px,#e8ebde 18px,#fbf9f0 19px);
  box-shadow:3px 6px 0 -2px #f0eee4,5px 8px 10px rgba(46,76,58,.09);
  color:#356d5a;
}
body .category-grid .askall-page-inner{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:100%;min-height:86px;padding:10px 4px;
  border-radius:6px;background:rgba(255,253,245,.94);
}
body .category-grid .askall-page-symbol{font-size:20px;line-height:1;color:#9cac86;margin-bottom:6px}
body .category-grid .askall-page-title{font-size:10px;line-height:1.25;font-weight:800;color:#2f614c;overflow-wrap:anywhere}
body .category-grid .askall-page-count{font-size:8.5px;line-height:1.3;margin-top:5px;color:#789080}
body .category-grid .cat-symbol{
  width:42px!important;height:42px!important;flex:none;
  margin:0 auto 12px!important;border-radius:13px!important;
  display:grid!important;place-items:center;
}
body .category-grid .cat-symbol .ico,
body .category-grid .cat-symbol svg{width:22px!important;height:22px!important}
body .category-grid .askall-book-cover h3{
  max-width:100%;font-size:10.8px!important;line-height:1.35!important;
  font-weight:800!important;margin:0 0 8px!important;
  color:#234b3b;overflow-wrap:anywhere;
}
body .category-grid .askall-book-cover small{
  font-size:8.5px!important;line-height:1.3!important;color:#8e9f90!important;
}
body .category-grid .category-card.is-opening .askall-book-cover{
  transform:rotateY(-130deg)!important;
  box-shadow:-3px 9px 15px rgba(49,82,62,.17);
}
@media(max-width:1050px){
  body .category-grid{grid-template-columns:repeat(4,minmax(0,1fr))!important}
}
@media(max-width:680px){
  body .category-grid{
    --askall-shelf-step:171px;
    grid-template-columns:repeat(3,minmax(0,1fr))!important;
    column-gap:7px!important;row-gap:26px!important;
    padding:10px 2px 18px;
    background-image:repeating-linear-gradient(to bottom,
      transparent 0px,transparent 151px,
      #e4e9dc 153px,#f6f6ed 156px,#d4ddcf 161px,
      rgba(76,105,81,.09) 163px,transparent 169px,transparent 171px);
  }
  body .category-grid .category-card{width:min(100%,112px)!important;height:145px!important}
  body .category-grid .askall-book-cover{padding:10px 6px 9px 14px}
  body .category-grid .askall-book-cover::after{inset:7px 6px 7px 14px}
  body .category-grid .cat-symbol{width:34px!important;height:34px!important;margin-bottom:10px!important;border-radius:11px!important}
  body .category-grid .cat-symbol .ico,body .category-grid .cat-symbol svg{width:19px!important;height:19px!important}
  body .category-grid .askall-book-cover h3{font-size:9px!important;margin-bottom:6px!important}
  body .category-grid .askall-book-cover small{font-size:7.5px!important}
}
@media(prefers-reduced-motion:reduce){
  body .category-grid .category-card,body .category-grid .askall-book-cover{
    transition:none!important;animation:none!important;
  }
}
</style>
<script id="askall-category-minibooks-v783-script">
(()=>{
  'use strict';
  if(window.__askallMiniBooks783)return;
  window.__askallMiniBooks783=true;
  const version=document.querySelector('meta[name="askall-version"]');
  if(version)version.setAttribute('content','7.8.3-mini-category-bookshelf');
  function decorate(){
    document.querySelectorAll('.category-grid .category-card[data-act="go-cat"]:not(.askall-mini-book-ready)').forEach(book=>{
      // Simpan tombol, data-id, kategori, dan event lama agar filter Supabase tetap bekerja.
      book.classList.add('askall-mini-book-ready');
      const name=book.querySelector('h3')?.textContent?.trim()||'Koleksi Buku';
      const count=book.querySelector('small')?.textContent?.trim()||'Jelajahi koleksi';
      const tone=book.querySelector('.cat-symbol')?.style.getPropertyValue('--cat-bg');
      if(tone&&/^#[0-9a-f]{6}$/i.test(tone.trim()))book.style.setProperty('--askall-book-tint',tone.trim());
      book.setAttribute('aria-label','Buka kategori '+name+', '+count);
      const cover=document.createElement('span');cover.className='askall-book-cover';
      while(book.firstChild)cover.appendChild(book.firstChild);
      const page=document.createElement('span');page.className='askall-book-page';page.setAttribute('aria-hidden','true');
      const inner=document.createElement('span');inner.className='askall-page-inner';
      const symbol=document.createElement('span');symbol.className='askall-page-symbol';symbol.textContent='✦';
      const label=document.createElement('span');label.className='askall-page-title';label.textContent=name;
      const small=document.createElement('span');small.className='askall-page-count';small.textContent=count;
      inner.append(symbol,label,small);page.append(inner);book.append(page,cover);
    });
  }
  let scheduled=false;
  const schedule=()=>{
    if(scheduled)return;
    scheduled=true;
    requestAnimationFrame(()=>{scheduled=false;decorate()});
  };
  decorate();
  const observer=new MutationObserver(schedule);
  observer.observe(document.body,{childList:true,subtree:true});
  document.addEventListener('click',event=>{
    if(!(event.target instanceof Element))return;
    const book=event.target.closest('.category-grid .category-card[data-act="go-cat"]');
    if(!book)return;
    if(book.dataset.askallAfterOpen==='1'){
      delete book.dataset.askallAfterOpen;
      return; // Klik kedua meneruskan handler kategori asli ASKALL.
    }
    event.preventDefault();event.stopImmediatePropagation();
    if(book.dataset.askallOpening==='1')return;
    book.dataset.askallOpening='1';
    book.classList.add('is-opening');
    const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.setTimeout(()=>{
      if(!book.isConnected)return;
      book.dataset.askallAfterOpen='1';
      book.click(); // Handler data-act="go-cat" asli membuka kategori yang sama.
    },reduced?0:650);
  },true);
})();
</script>
<!-- /ASKALL V7.8.3 -->
