.askall-read-dock .askall-dock-cancel{border:0;background:none;color:#849a8a;padding:7px;font-size:20px;line-height:1}
.askall-receipt-modal{width:min(520px,100%);margin:auto;padding:20px 22px 27px;max-height:min(88vh,900px);overflow:auto;position:relative;background:#e6efe5;border-radius:25px;box-shadow:0 18px 70px #1a322e52}
.askall-receipt-modal .askall-r-close{position:sticky;z-index:3;top:0;float:right;width:34px;height:34px;border-radius:50%;border:1px solid #dfebd9;background:#fff;color:#496954;font-size:20px}
.askall-r-eyebrow{text-align:center;font-size:10px;font-weight:900;letter-spacing:.18em;color:#4e8263;margin:8px 0 15px}
.askall-r-paper{position:relative;margin:8px auto 15px;padding:29px 27px 32px;max-width:380px;background:#fffdf5;color:#375a46;border-radius:4px;box-shadow:0 15px 35px #3b534225;animation:askall-receipt-drop .55s ease-out both}
.askall-r-paper::before,.askall-r-paper::after{content:'';position:absolute;height:10px;left:0;right:0;background:radial-gradient(circle at 8px 1px,#e6efe5 5px,transparent 5.5px) repeat-x;background-size:18px 10px}
.askall-r-paper::before{top:-1px;transform:rotate(180deg)}.askall-r-paper::after{bottom:-1px}
@keyframes askall-receipt-drop{from{opacity:0;transform:translateY(-28px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.askall-r-brand{text-align:center;color:#38684f;font:500 30px/1.2 Fraunces,Georgia,serif;margin:6px 0 4px}
.askall-r-sub{text-align:center;color:#829586;font-size:9px;letter-spacing:.16em;font-weight:800}
.askall-r-divider{border-top:1px dashed #b7c4ad;margin:19px 0}
.askall-r-row{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;margin:13px 0;font-size:11px;line-height:1.5}
.askall-r-row span{color:#85998d;letter-spacing:.03em;flex-shrink:0}.askall-r-row strong{color:#365744;text-align:right;max-width:67%;overflow-wrap:anywhere;font-weight:800}
.askall-r-quote{font:500 23px/1.4 Fraunces,Georgia,serif;color:#38634b;text-align:center;margin:18px 0 7px}
.askall-r-message{font-size:10px;line-height:1.75;color:#819284;text-align:center;margin:4px 0 19px}
.askall-r-stamp{background:#e8f0e6;border:1px solid #d5e4d3;text-align:center;border-radius:10px;padding:10px;color:#4f795f;font-size:10px;font-weight:800;letter-spacing:.07em}
.askall-r-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:13px 0 8px}
.askall-r-actions button{border:1px solid #cedfce;background:#fffefa;color:#39644d;border-radius:12px;padding:12px 9px;font-size:11px;font-weight:800}
.askall-r-actions button.primary{background:#356d5a;color:#fff;border-color:#356d5a}
.askall-r-note{display:block;font-size:10px;color:#63816c;text-align:center;line-height:1.7;margin:10px 0 0}
.askall-r-history{display:grid;gap:10px;clear:both;max-height:55vh;overflow:auto;padding:5px 0}
.askall-r-history-item{display:flex;gap:10px;align-items:center;background:#fffdf8;border:1px solid #dfe7d9;border-radius:14px;padding:12px;text-align:left}
.askall-r-history-item .text{min-width:0;flex:1}.askall-r-history-item strong{display:block;color:#2d5741;font-size:11px;line-height:1.55}.askall-r-history-item small{color:#81958a;font-size:10px;display:block;margin-top:4px}
.askall-r-history-item button{border:0;border-radius:9px;background:#e8f1e7;color:#38694c;padding:8px 10px;font-size:10px;font-weight:800}
.askall-r-history-item button.askall-r-trash{background:#faeeee;color:#a25d5b}
.askall-r-empty{text-align:center;background:#fffdf8;border-radius:15px;padding:22px;color:#6d8b71;font-size:12px;line-height:1.8}
@media(max-width:600px){.askall-receipt-catalog{padding:17px;flex-wrap:wrap}.askall-receipt-catalog button{width:100%}.askall-read-dock{bottom:10px;gap:8px;padding:9px}.askall-read-dock .askall-dock-mark{width:35px;height:35px}.askall-read-dock .askall-dock-done{font-size:10px;padding:11px 9px}.askall-receipt-modal{padding:13px 12px 20px;width:min(98vw,460px)}.askall-r-paper{padding:22px 18px 27px}.askall-r-actions{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){.askall-read-dock,.askall-r-paper{animation:none!important}}


/* ASKALL V7.8.1 – Rak buku sungguhan, buku terangkat & terbuka.
   Semua ilustrasi dibuat dengan CSS. Tanpa gambar, library, atau database baru. */
.askall-feature-library{margin:43px auto 36px;position:relative;isolation:isolate}
.askall-feature-top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 2px 19px}
.askall-feature-kicker{font-size:10px;letter-spacing:.17em;color:#66856b;font-weight:850}
.askall-feature-top h2{font-family:Georgia,serif;font-size:clamp(29px,3vw,40px);font-weight:600;letter-spacing:-.04em;color:#294c3c;margin:5px 0 7px;line-height:1.15}
.askall-feature-top h2 em{font-weight:400;color:#759477}
.askall-feature-top p{color:#758476;font-size:12px;line-height:1.6;margin:0}
.askall-feature-count{padding:10px 14px;border-radius:99px;background:#f1f5ed;border:1px solid #dce5d7;color:#5f8264;font-size:10px;letter-spacing:.1em;font-weight:800;white-space:nowrap}
.askall-bookshelf{position:relative;background:linear-gradient(170deg,#f6f0e3,#e9e6d9 65%,#efeee4);border:1px solid #d7dcca;border-radius:21px;padding:21px 22px 0;box-shadow:0 13px 40px #49624a14,inset 0 2px 4px #fff9;overflow:hidden}
.askall-bookshelf::before,.askall-bookshelf::after{content:"";position:absolute;top:15px;bottom:0;width:12px;background:linear-gradient(90deg,#c6b395,#f6ead2,#c7b595);border:1px solid #c0b193;z-index:0}
.askall-bookshelf::before{left:0;border-radius:12px 0 0 0}.askall-bookshelf::after{right:0;border-radius:0 12px 0 0}
.askall-bookshelf-scroller{position:relative;z-index:1;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#d0bea0 transparent}
.askall-bookshelf-row{min-width:620px;min-height:240px;display:flex;align-items:flex-end;justify-content:center;gap:11px;padding:11px 20px 0}
.askall-spine{--cover:#638a75;--cover-deep:#315e4b;--ink:#f8f2df;position:relative;flex:0 0 111px;width:111px;height:210px;padding:14px 9px 12px;border:1px solid #ffffff5e;border-left:7px solid #ffffff35;border-right:5px solid #20362a35;border-radius:8px 12px 3px 3px;background:linear-gradient(90deg,#142b2640 0%,var(--cover-deep) 8%,var(--cover) 28%,var(--cover) 75%,var(--cover-deep) 100%);box-shadow:3px 1px 5px #294b3530,inset 3px 0 3px #eaf3dc44,0 8px 11px #394a2d26;display:flex;flex-direction:column;align-items:center;justify-content:space-between;color:var(--ink);cursor:pointer;transition:transform .38s cubic-bezier(.18,.8,.2,1),box-shadow .38s,border-color .25s;transform-origin:center bottom}
.askall-spine--path{--cover:#648d78;--cover-deep:#355d4a;height:213px}
.askall-spine--anatomy{--cover:#ac9472;--cover-deep:#786346;height:225px}
.askall-spine--clinic{--cover:#487569;--cover-deep:#295c54;height:220px}
.askall-spine--dictionary{--cover:#87977d;--cover-deep:#596d50;height:204px}
.askall-spine::before{content:"";pointer-events:none;position:absolute;inset:12px 6px;border-block:2px solid #f9e5b68c}
.askall-spine::after{content:"";position:absolute;inset:6px auto 7px 6px;width:2px;background:#fff6ce3b}
.askall-spine:hover,.askall-spine[aria-expanded="true"]{transform:translateY(-15px) rotate(-1.5deg);box-shadow:6px 12px 17px #28433333,inset 3px 0 3px #fff5df67}
.askall-spine:focus-visible{outline:3px solid #37845d;outline-offset:5px}
.askall-spine-top,.askall-spine-foot{display:grid;place-items:center;width:100%;font-family:Georgia,serif;color:#fff0c9;text-shadow:0 1px 2px #19282055}
.askall-spine-top{font-size:23px;height:37px}.askall-spine-foot{font-size:10px;letter-spacing:.13em;height:27px;font-weight:750}
.askall-spine-title{display:block;writing-mode:vertical-rl;transform:rotate(180deg);height:120px;max-width:80px;line-height:1.1;font-family:Georgia,serif;font-size:18px;font-weight:650;letter-spacing:.015em;text-shadow:0 1px 3px #233d375a;text-align:center}
.askall-shelf-decor{flex:none;display:flex;gap:4px;align-items:flex-end;align-self:flex-end;pointer-events:none}
.askall-decor-book{display:block;width:29px;height:160px;border-radius:3px 5px 2px 2px;border-left:3px solid #ffffff6e;border-right:3px solid #4b634b44;background:linear-gradient(90deg,#748c6e,#a8baa0,#82997d);box-shadow:2px 2px 4px #3c513527;position:relative}
.askall-decor-book::after{content:"";position:absolute;left:4px;right:4px;top:17px;bottom:15px;border-block:2px solid #f4ecd0a1}
.askall-decor-book:nth-child(2){height:183px;background:linear-gradient(90deg,#b49c7d,#d5c2a4,#ab987b)}
.askall-decor-book:nth-child(3){height:149px;background:linear-gradient(90deg,#7b9c8c,#a2bbad,#648f81);transform:rotate(-8deg);transform-origin:bottom}
.askall-shelf-pot{width:83px;height:120px;position:relative;flex:none;margin-left:14px;pointer-events:none}
.askall-shelf-pot .pot{position:absolute;left:19px;bottom:0;width:51px;height:51px;background:linear-gradient(95deg,#afc1a7,#e8e0ce,#9fae93);clip-path:polygon(0 0,100% 0,84% 100%,18% 100%);border-radius:5px 5px 12px 12px;box-shadow:0 5px 11px #56724a25}
.askall-shelf-pot .sprig{position:absolute;left:45px;bottom:44px;width:3px;height:70px;background:#729879;transform:rotate(7deg);transform-origin:bottom}
.askall-shelf-pot .leaf{position:absolute;width:30px;height:15px;border-radius:70% 0 70% 0;background:#82a887;transform:rotate(-23deg);left:17px;bottom:85px;box-shadow:14px 17px 0 -1px #90ad88}
.askall-shelf-pot .leaf.l2{left:40px;bottom:96px;transform:scaleX(-1) rotate(10deg);background:#6d957c}
.askall-shelf-pot .leaf.l3{left:12px;bottom:63px;transform:rotate(-12deg);background:#a6bea0}
.askall-wood-plank{height:27px;position:relative;z-index:2;margin:0 -22px;background:linear-gradient(180deg,#edddc0 0%,#d2b995 20%,#c1a783 55%,#b89c7c 80%,#dfc6a4 100%);border-top:2px solid #f6ead5;box-shadow:0 8px 15px #6a54301e, inset 0 -2px 3px #8f70441e}
.askall-wood-plank::before{content:"";position:absolute;left:6%;right:6%;top:7px;border-top:1px solid #f7eddd8a}
.askall-shelf-legend{text-align:center;color:#748776;font-size:11px;letter-spacing:.04em;margin:13px 0 0}
.askall-shelf-drawer[hidden]{display:none!important}
.askall-shelf-drawer{--drawer-cover:#638a75;--drawer-deep:#315e4b;max-height:0;opacity:0;transform:translateY(-18px) scale(.987);overflow:hidden;border-radius:22px;border:1px solid transparent;margin-top:0;background:linear-gradient(120deg,#f3f5e9,#fffdf5);transition:max-height .62s cubic-bezier(.25,.75,.25,1),opacity .42s ease,transform .55s cubic-bezier(.24,.85,.26,1),margin .42s ease,border-color .3s}
.askall-shelf-drawer.is-open{max-height:650px;opacity:1;transform:translateY(0) scale(1);border-color:#d7e2cf;margin-top:15px;box-shadow:0 18px 34px #405d4216}
.askall-drawer-inner{display:grid;grid-template-columns:minmax(220px,40%) minmax(0,60%);align-items:center;gap:12px;min-height:284px;padding:28px 35px;position:relative}
.askall-drawer-close{position:absolute;right:17px;top:15px;z-index:3;background:#fffdf6;border:1px solid #d6dfd0;color:#4c765a;border-radius:50%;height:35px;width:35px;font-size:19px;display:grid;place-items:center}
.askall-drawer-close:focus-visible{outline:3px solid #418358}
