/* ASKALL Citation Studio 7.1 — APA 7 book references, local processing only. */
const ASKALL_APA_ACRONYMS=new Set(['APA','TENS','DPN','CRPS','MRI','NPRS','VAS','DT','EMG','EEG','ECG','WHO','ICF','ICU','CT','USG','ADL','ROM','GBS','CNS','PNS','PDF']);
function askallSentenceTitle(value){
 const src=String(value||'').trim().replace(/\s+/g,' ');
 if(!src)return '';
 let capNext=true;
 return src.replace(/([\p{L}][\p{L}'’\-]*|\d+)/gu,(word,wordValue,offset)=>{
  const plain=word.replace(/['’\-]/g,'');
  const isInitial=capNext;
  capNext=false;
  if(ASKALL_APA_ACRONYMS.has(word.toUpperCase())&&word.length<6)return word.toUpperCase();
  const lower=word.toLocaleLowerCase('id-ID');
  return isInitial?lower.charAt(0).toLocaleUpperCase('id-ID')+lower.slice(1):lower;
 }).replace(/([:.!?]\s+)([\p{L}])/gu,(full,prefix,char)=>prefix+char.toLocaleUpperCase('id-ID'));
}
function askallApaOneAuthor(input){
 let name=String(input||'').trim().replace(/\s+/g,' ');
 // Academic degrees are not author initials (e.g., Carolyn Kisner, PT, MS).
 name=name.replace(/,\s*(?:Ph\.?D\.?|M\.?Sc\.?|M\.?S\.?|PT|DPT|ATC|MD|BSc|MPT|M\.A\.|RN|MEd)(?:\s*,\s*[\w.]+)*\s*$/i,'').trim();
 if(!name)return {entry:'',short:'',uncertain:true};
 // Preserve properly formatted "Surname, A. B." records.
 const apa=/^([^,]+),\s*([A-Z](?:\.|\s)(?:\s*[A-Z]\.?)*)$/i.exec(name);
 if(apa){const last=apa[1].trim();const proper=last===last.toLocaleUpperCase('id-ID')?last.charAt(0).toLocaleUpperCase('id-ID')+last.slice(1).toLocaleLowerCase('id-ID'):last;return {entry:proper+', '+apa[2].trim(),short:proper,uncertain:false};}
 const pieces=name.split(/\s+/).filter(Boolean);
 // Organizational authors should not be reformatted as personal names.
 if(pieces.length===1||/\b(?:association|organization|organisation|university|college|institute|society|academy|foundation|commission|committee|department|ministry|hospital|publishing|press)\b/i.test(name))
  return {entry:name,short:name,uncertain:false};
 if(pieces.length>4||/[;&/]/.test(name))return {entry:name,short:name,uncertain:true};
 const rawSurname=pieces.at(-1);const surname=rawSurname===rawSurname.toLocaleUpperCase('id-ID')?rawSurname.charAt(0).toLocaleUpperCase('id-ID')+rawSurname.slice(1).toLocaleLowerCase('id-ID'):rawSurname;
 const initials=pieces.slice(0,-1).map(w=>w.replace(/[^\p{L}]/gu,'')).filter(Boolean).map(w=>w[0].toLocaleUpperCase('id-ID')+'.').join(' ');
 return {entry:surname+', '+initials,short:surname,uncertain:false};
}
function askallApaAuthors(raw){
 const input=String(raw||'').trim();
 if(!input)return {entry:'',parenthetical:'',narrative:'',uncertain:true,missing:true};
 const names=input.split(/\s*(?:;|\s+&\s+|\s+and\s+|\s+dan\s+)\s*/i).filter(Boolean);
 const all=names.map(askallApaOneAuthor);
 const fmt=all.map(x=>x.entry).filter(Boolean);
 const items=fmt.length>20?[...fmt.slice(0,19),'…',fmt.at(-1)]:fmt;
 const entry=items.length===1?items[0]:items.length===2?items.join(', & '):items.slice(0,-1).join(', ')+', & '+items.at(-1);
 const first=all[0]?.short||'';
 const inline=all.length===1?first:all.length===2?first+' & '+all[1].short:first+' et al.';
 const narrative=all.length===1?first:all.length===2?first+' dan '+all[1].short:first+' et al.';
 return {entry,parenthetical:inline,narrative,uncertain:all.some(x=>x.uncertain),missing:false};
}
function askallApaEdition(raw){
 const input=String(raw||'').trim();if(!input)return '';
 const m=input.match(/(?:edisi\s*(?:ke\s*[-:]?)?|edition\s*|)(\d+)(?:st|nd|rd|th)?\s*(?:edition|ed\.?|edisi)?/i);
 if(!m)return '('+input+')';
 const n=Number(m[1]);if(!Number.isInteger(n)||n<=1)return '';
 const suffix=n%100>=11&&n%100<=13?'th':n%10===1?'st':n%10===2?'nd':n%10===3?'rd':'th';
 return '('+n+suffix+' ed.)';
}
function askallApaDOI(raw){
 const doi=String(raw||'').trim().replace(/^https?:\/\/(?:dx\.)?doi\.org\//i,'').replace(/^doi:\s*/i,'');
 if(!doi)return '';
 if(!/^10\.\d{4,9}\/.+$/i.test(doi))return '';
 return 'https://doi.org/'+doi;
}
function askallCitationData(book){
 const a=askallApaAuthors(book.author);
 const year=/^\d{4}$/.test(String(book.year||'').trim())?String(book.year).trim():'n.d.';
 const title=askallSentenceTitle(book.title);
 const edition=askallApaEdition(book.edition);
 const publisher=String(book.publisher||'').trim();
 const doi=askallApaDOI(book.doi);
 const parts=[];
 const titleFirst=!a.entry;
 if(!titleFirst)parts.push(a.entry+(a.entry.endsWith('.')?'':'.'));
 parts.push('('+year+').');
 parts.push(title+(edition?' '+edition:'' )+'.');
 if(publisher&&publisher.toLocaleLowerCase('id-ID')!==String(book.author||'').trim().toLocaleLowerCase('id-ID'))parts.push(publisher+'.');
 if(doi)parts.push(doi);
 const refPlain=parts.join(' ').replace(/\.\./g,'.');
 const yearPart='('+year+')';
 const citeKey=a.parenthetical||(title.length>55?title.slice(0,52)+'…':title);
 const narrativeKey=a.narrative||(title.length>55?title.slice(0,52)+'…':title);
 const warnings=[];
 if(!book.author||!String(book.author).trim())warnings.push('Nama penulis belum dicantumkan; cek apakah karya menggunakan judul sebagai unsur pertama.');
 if(a.uncertain&&!a.missing)warnings.push('Susunan nama penulis perlu diperiksa; pisahkan beberapa penulis dengan tanda titik koma (;).');
 if(year==='n.d.')warnings.push('Tahun tidak lengkap; sistem memakai n.d. sampai tahun penerbitan diverifikasi.');
 if(!publisher)warnings.push('Nama penerbit belum diisi. Sitasi daftar pustaka mungkin belum lengkap.');
 if(book.doi&&!doi)warnings.push('DOI belum valid. Periksa format seperti 10.1000/xyz123.');
 if(/\b(?:first|second|third|fourth|fifth|sixth|seventh|eighth|ninth|tenth)\s+edition\b/i.test(String(book.title||'')))warnings.push('Judul mungkin mencantumkan keterangan edisi; periksa judul dan pindahkan edisi ke kolom Edisi jika sesuai.');
 if(String(book.title||'')!==title)warnings.push('Penulisan kapitalisasi judul diubah otomatis; periksa nama diri dan istilah khusus.');
 // Data in the existing catalogue may be imported from PDF and is not verified bibliography.
 const html=(a.entry?esc(a.entry)+(a.entry.endsWith('.')?'':'.')+' ('+esc(year)+'). <em>'+esc(title)+'</em>':'<em>'+esc(title)+'</em>. ('+esc(year)+')')+(edition?' '+esc(edition):'')+'.'+(publisher&&publisher.toLocaleLowerCase('id-ID')!==String(book.author||'').trim().toLocaleLowerCase('id-ID')?' '+esc(publisher)+'.':'')+(doi?' '+esc(doi):'');
 const plain=(a.entry?a.entry+(a.entry.endsWith('.')?'':'.')+' ('+year+'). '+title:title+'. ('+year+')')+(edition?' '+edition:'')+'.'+(publisher&&publisher.toLocaleLowerCase('id-ID')!==String(book.author||'').trim().toLocaleLowerCase('id-ID')?' '+publisher+'.':'')+(doi?' '+doi:'');
 return {html,plain,parenthetical:'('+citeKey+', '+year+')',narrative:narrativeKey+' ('+year+')',warnings};
}
function askallCitationPanel(book){
 const c=askallCitationData(book);const key=esc(book.id);
 return `<section class="askall-cite-panel" id="askall-cite-panel" aria-label="Citation Generator APA 7"><div class="askall-cite-heading">${el('book',21)}<div><span class="askall-cite-kicker">ASKALL CITATION STUDIO</span><strong>Sitasi Buku • APA Edisi 7</strong></div></div><div class="askall-cite-reference">${c.html}</div><div class="askall-cite-actions"><button type="button" data-act="citation-copy" data-kind="reference" data-id="${key}">${el('copy',15)} Salin Daftar Pustaka</button><button type="button" data-act="citation-copy" data-kind="parenthetical" data-id="${key}">${el('copy',15)} (Penulis, Tahun)</button><button type="button" data-act="citation-copy" data-kind="narrative" data-id="${key}">${el('copy',15)} Penulis (Tahun)</button></div><div class="askall-cite-note">Hasil otomatis adalah draf sitasi buku utuh. Cocokkan penulis, judul, tahun, edisi, dan penerbit dengan halaman identitas buku asli sebelum dipakai dalam tugas atau skripsi. ISBN tidak masuk format referensi APA 7.</div>${c.warnings.length?`<div class="askall-cite-note important">⚠️ ${esc(c.warnings.join(' '))}</div>`:''}</section>`;
}
async function askallCopyCitation(book,kind){
 const c=askallCitationData(book);
 const plain=kind==='parenthetical'?c.parenthetical:kind==='narrative'?c.narrative:c.plain;
 try{
  if(kind==='reference'&&navigator.clipboard?.write&&window.ClipboardItem){
   const rich=new Blob(['<p>'+c.html+'</p>'],{type:'text/html'});
   const text=new Blob([plain],{type:'text/plain'});
   await navigator.clipboard.write([new ClipboardItem({'text/html':rich,'text/plain':text})]);
  }else if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(plain)}
  else{
   const t=document.createElement('textarea');t.value=plain;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok)throw Error('Copy tidak didukung');
  }
  toast(kind==='reference'?'Sitasi APA 7 disalin. Periksa kembali metadata buku.':'Kutipan dalam teks berhasil disalin.');
 }catch{toast('Belum bisa menyalin otomatis. Coba pilih teks sitasi lalu salin manual.');}
}

let dewAudioCtx=null;
function playDew(){
 if(!S.dewSoundOn)return;
 try{
  const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
  if(!dewAudioCtx)dewAudioCtx=new Ctx();
  if(dewAudioCtx.state==='suspended')void dewAudioCtx.resume();
  const t=dewAudioCtx.currentTime;
  const osc=dewAudioCtx.createOscillator(),volume=dewAudioCtx.createGain();
  osc.type='sine';osc.frequency.setValueAtTime(1080,t);osc.frequency.exponentialRampToValueAtTime(540,t+.14);
  volume.gain.setValueAtTime(.0001,t);volume.gain.exponentialRampToValueAtTime(.018,t+.012);volume.gain.exponentialRampToValueAtTime(.0001,t+.17);
  osc.connect(volume);volume.connect(dewAudioCtx.destination);osc.start(t);osc.stop(t+.18);
 }catch(err){console.warn('Efek suara tidak tersedia:',err)}

function askallLearningPage(){const path=askallLPPath(),steps=askallLPSteps(),done=steps.filter(x=>S.learningDone.includes(x.id)).length,percent=steps.length?Math.round(done/steps.length*100):0;
 const note=!S.online?`<div class="askall-learning-error">Data jalur belajar memerlukan koneksi Supabase. Silakan periksa internet dan muat ulang halaman.</div>`:S.learningError?`<div class="askall-learning-error">Jalur belajar belum dapat dimuat: ${esc(S.learningError)} <button class="btn secondary small" data-act="learning-refresh">Coba lagi</button></div>`:!S.learningReady?`<div class="askall-learning-error">Menyiapkan jalur belajar dari perpustakaan... <button class="btn secondary small" data-act="learning-refresh">Muat ulang</button></div>`:'';
 return `<main class="wrap askall-learning-main"><section class="askall-learning-hero"><div class="askall-learning-head"><span class="askall-learning-kicker">✦ ASKALL LEARNING PATH</span><h1>Belajar Fisioterapi,<br>Selangkah Demi Selangkah.</h1><p>${esc(path?.description||'Perjalanan belajar dari anatomi, gerak tubuh, pemeriksaan, hingga penerapan ilmu fisioterapi. Setiap tahapan dihubungkan dengan koleksi buku ASKALL.')}</p><div class="askall-learning-badges"><span>📚 ${steps.length||5} tahap belajar</span><span>🌿 Referensi dari ASKALL</span><span>♡ Gratis untuk pembaca</span></div></div></section>${note}${steps.length?`<div class="askall-learning-progress"><div class="askall-learning-progress-copy"><strong>Perjalanan belajarmu: ${done} dari ${steps.length} tahap</strong><small>Progres tersimpan di browser perangkat ini.</small></div><div class="askall-learning-progressbar" role="progressbar" aria-label="Progres jalur belajar" aria-valuenow="${percent}" aria-valuemin="0" aria-valuemax="100"><i style="width:${percent}%"></i></div></div><div class="askall-learning-list">${steps.map((step,i)=>{const linked=askallLPBooks(step.id),checked=S.learningDone.includes(step.id);return `<section class="askall-learning-step" id="askall-step-${esc(step.code)}"><div class="askall-learning-step-head"><div class="askall-learning-number">${String(i+1).padStart(2,'0')}</div><div class="askall-learning-text"><span class="askall-learning-label">TAHAP ${String(i+1).padStart(2,'0')} / ${steps.length}</span><h2>${esc(step.title)}</h2><p>${esc(step.description)}</p></div><button class="askall-learning-done ${checked?'is-done':''}" type="button" data-act="learning-toggle" data-id="${esc(step.id)}" aria-pressed="${checked?'true':'false'}">${checked?'✓ Selesai':'Tandai selesai'}</button></div><div class="askall-learning-books"><span class="askall-learning-books-label">${linked.length?linked.length+' Referensi untuk tahap ini':'Referensi tahap ini'}</span>${linked.length?`<div class="askall-learning-book-list">${linked.map(b=>`<button type="button" class="askall-learning-book" data-act="detail" data-id="${esc(b.id)}">${el('book',19)}<span>${esc(b.title)}<small>${esc(b.author||getCat(b.category_id).name)}</small></span>${el('arrow',14)}</button>`).join('')}</div>`:`<div class="askall-learning-empty">Buku rekomendasi untuk tahap ini belum dipilih admin. Koleksi tetap bisa dibaca melalui halaman <button data-page="catalog" style="border:0;background:transparent;color:#386b4d;font-weight:800;text-decoration:underline;cursor:pointer">Koleksi Buku</button>.</div>`}</div></section>`}).join('')}</div>`:`<div class="askall-learning-error">Tahap belajar belum tersedia. Admin dapat menambahkan tahap melalui Supabase.</div>`}<p class="askall-learning-note" style="margin-top:23px">Jalur belajar ini adalah panduan membaca, bukan pengganti pendidikan klinis atau supervisi praktik fisioterapi.</p></main>`}
function askallLearningAdmin(){if(!S.online)return `<div class="alert warning">Jalur belajar dapat dikelola setelah login dengan akun admin Supabase.</div>`;if(S.learningError)return `<div class="alert warning">Gagal membaca database Learning Path: ${esc(S.learningError)} <button class="btn secondary small" data-act="learning-refresh">Muat ulang</button></div>`;
 const p=askallLPPath(),steps=askallLPSteps();if(!S.learningReady)return `<div class="alert">Memuat data jalur belajar... <button data-act="learning-refresh" class="btn secondary small">Muat ulang</button></div>`;
 return `<div class="panel"><h3>Learning Path Fisioterapi</h3><p class="askall-learning-admin-intro">Pilih buku dari koleksi ASKALL untuk masing-masing tahap. Menambah atau melepas hubungan <strong>tidak menghapus buku maupun PDF</strong>. Judul dan deskripsi tahap dapat diperbarui di sini.</p><div class="dashboard-stats"><div class="statbox"><small>Jalur belajar</small><strong>${S.learningPaths.length}</strong></div><div class="statbox"><small>Tahap aktif</small><strong>${steps.length}</strong></div><div class="statbox"><small>Rekomendasi buku</small><strong>${S.learningLinks.length}</strong></div></div><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:13px"><button class="btn secondary small" type="button" data-act="learning-refresh">${el('cloud',15)} Segarkan Data</button><button class="btn secondary small" type="button" data-page="learning">Lihat Halaman Publik ${el('arrow',14)}</button></div></div>${p?steps.map((step,i)=>{const assigned=askallLPBooks(step.id),available=books().filter(b=>!S.learningLinks.some(l=>l.step_id===step.id&&l.book_id===b.id)).sort((a,b)=>String(a.title).localeCompare(String(b.title),'id'));return `<section class="askall-learning-admin-card"><div class="askall-learning-admin-title"><span class="askall-learning-number">${i+1}</span><h3>${esc(step.title)}</h3></div><div class="askall-learning-admin-split"><div><form data-askall-learning-form="step" data-step-id="${esc(step.id)}"><div><label>Nama tahap</label><input name="title" required maxlength="120" value="${esc(step.title)}"></div><div><label>Penjelasan untuk pembaca</label><textarea name="description" maxlength="700">${esc(step.description)}</textarea></div><button class="btn secondary small" type="submit">Simpan Tahap</button></form></div><div class="askall-learning-admin-books"><h4>Buku pilihan (${assigned.length})</h4>${assigned.length?assigned.map(b=>`<div class="askall-learning-assigned"><span>${esc(b.title)}</span><button type="button" data-act="learning-remove" data-step-id="${esc(step.id)}" data-id="${esc(b.id)}" title="Hapus dari rekomendasi, bukan dari katalog">Lepas</button></div>`).join(''):`<p class="askall-learning-note">Belum ada buku untuk tahap ini.</p>`}<form data-askall-learning-form="link" data-step-id="${esc(step.id)}"><div><label>Pilih buku dari koleksi</label><select name="book_id" required ${available.length?'':'disabled'}><option value="">${available.length?'Pilih salah satu buku…':'Semua buku sudah terpilih'}</option>${available.map(b=>`<option value="${esc(b.id)}">${esc(b.title)}</option>`).join('')}</select></div><button class="btn primary small" type="submit" ${available.length?'':'disabled'}>${el('plus',14)} Tambah Buku</button></form></div></div></section>`}).join(''):'<div class="alert warning">Jalur belajar belum dibuat di Supabase. Pastikan SQL Tahap 1 sudah dijalankan.</div>'}`}
async function askallFetchLearning(){if(!S.online||!S.client){S.learningError='Koneksi Supabase belum tersedia';return}if(S.learningLoading)return;S.learningLoading=true;S.learningError='';try{
 const queries=[S.client.from('askall_learning_paths').select('id,slug,title,description,sort_order,is_published').order('sort_order',{ascending:true}),S.client.from('askall_learning_steps').select('id,path_id,code,title,description,sort_order').order('sort_order',{ascending:true}),S.client.from('askall_learning_step_books').select('step_id,book_id,sort_order').order('sort_order',{ascending:true})];
 const all=await Promise.all(queries);for(const q of all)if(q.error)throw q.error;S.learningPaths=all[0].data||[];S.learningSteps=all[1].data||[];S.learningLinks=all[2].data||[];S.learningReady=true;
 }catch(err){S.learningError=String(err.message||err);S.learningReady=false;console.warn('ASKALL Learning Path:',err)}finally{S.learningLoading=false;if(!S.modal&&(S.page==='learning'||S.page==='admin'&&S.tab==='learning'))render()}}
function askallToggleLearning(id){if(!S.learningSteps.some(s=>s.id===id))return;S.learningDone=S.learningDone.includes(id)?S.learningDone.filter(x=>x!==id):[...S.learningDone,id];try{localStorage.setItem('askall-learning-done-v1',JSON.stringify(S.learningDone))}catch{}render()}
async function askallLinkLearningBook(form){if(!S.admin||!S.online||!S.client){toast('Login admin online diperlukan.');return}const stepId=form.dataset.stepId;const bookId=String(new FormData(form).get('book_id')||'');if(!S.learningSteps.some(s=>s.id===stepId)||!books().some(b=>b.id===bookId)){toast('Pilih buku yang tersedia.');return}if(S.learningLinks.some(x=>x.step_id===stepId&&x.book_id===bookId)){toast('Buku ini sudah terhubung ke tahap tersebut.');return}const button=form.querySelector('button[type="submit"]');if(button)button.disabled=true;try{const {error}=await S.client.from('askall_learning_step_books').insert({step_id:stepId,book_id:bookId,sort_order:(askallLPLinks(stepId).length+1)*10});if(error)throw error;await askallFetchLearning();toast('Buku berhasil ditambahkan ke tahap belajar.')}catch(err){toast('Gagal menambah buku: '+String(err.message||err));if(button)button.disabled=false}}
async function askallRemoveLearningBook(stepId,bookId){if(!S.admin||!S.online||!S.client){toast('Login admin online diperlukan.');return}if(!S.learningLinks.some(x=>x.step_id===stepId&&x.book_id===bookId))return;if(!window.confirm('Lepas buku dari rekomendasi tahap ini? Buku dan PDF tetap tersimpan.'))return;try{const {error}=await S.client.from('askall_learning_step_books').delete().eq('step_id',stepId).eq('book_id',bookId);if(error)throw error;await askallFetchLearning();toast('Rekomendasi dilepas. Buku tetap aman.')}catch(err){toast('Tidak dapat melepas buku: '+String(err.message||err))}}
async function askallSaveLearningStep(form){if(!S.admin||!S.online||!S.client){toast('Login admin online diperlukan.');return}const stepId=form.dataset.stepId;if(!S.learningSteps.some(s=>s.id===stepId))return;const data=new FormData(form);const title=String(data.get('title')||'').trim().slice(0,120),description=String(data.get('description')||'').trim().slice(0,700);if(!title){toast('Judul tahap wajib diisi.');return}const button=form.querySelector('button[type="submit"]');if(button)button.disabled=true;try{const {error}=await S.client.from('askall_learning_steps').update({title,description}).eq('id',stepId);if(error)throw error;await askallFetchLearning();toast('Tahap belajar berhasil diperbarui.')}catch(err){toast('Gagal menyimpan: '+String(err.message||err));if(button)button.disabled=false}}

function askallDictResults(){const list=askallDictFiltered();return list.length?list.map(x=>{const href=x.source_url?url(x.source_url):'';return `<article class="askall-dict-card"><div class="askall-dict-card-top"><span>${esc(x.category)}</span><span class="askall-dict-dot">●</span></div><h3>${esc(x.term)}</h3><p>${esc(x.definition)}</p>${x.example?`<div class="askall-dict-example"><strong>Contoh:</strong> ${esc(x.example)}</div>`:''}${x.source_title?`<div class="askall-dict-source"><strong>Sumber:</strong> ${href?`<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(x.source_title)}</a>`:esc(x.source_title)}</div>`:''}</article>`}).join(''):`<div class="askall-dict-empty">Belum ada istilah yang cocok. Coba kata kunci lain atau pilih kategori berbeda.</div>`}
function askallDictionaryPage(){const categories=[...new Set(askallDictVisible().map(x=>x.category))].sort((a,b)=>a.localeCompare(b,'id'));const loading=!S.dictReady&&!S.dictError;const notice=!S.online?'Kamus memerlukan sambungan internet dan Supabase.':S.dictError?'Kamus belum dapat dimuat: '+S.dictError:loading?'Sedang memuat istilah dari perpustakaan...':'';return `<main class="wrap askall-dict-page"><header class="askall-dict-hero"><span class="askall-dict-kicker">✦ ASKALL PHYSIO DICTIONARY</span><h1>Kamus Kecil,<br><em>Untuk Ilmu yang Besar.</em></h1><p>Temukan arti istilah fisioterapi dengan penjelasan sederhana dan contoh penerapan. Gratis, tanpa AI.</p><div class="askall-dict-counter"><span>📖 ${askallDictVisible().length} istilah terbit</span><span>🌿 ${categories.length} bidang</span></div></header>${notice?`<div class="askall-dict-notice" role="status">${esc(notice)} <button type="button" data-act="dict-refresh">Muat ulang</button></div>`:''}<div class="askall-dict-searchbox">${el('search',20)}<input id="askall-dict-search" type="search" maxlength="120" autocomplete="off" value="${esc(S.dictQuery)}" placeholder="Cari istilah, misalnya neuroplastisitas..." aria-label="Cari istilah fisioterapi"></div><div class="askall-dict-filters"><button class="${S.dictCategory==='all'?'active':''}" data-act="dict-filter" data-id="all">Semua</button>${categories.map(c=>`<button class="${S.dictCategory===c?'active':''}" data-act="dict-filter" data-id="${esc(c)}">${esc(c)}</button>`).join('')}</div><p class="askall-dict-count" id="askall-dict-count" aria-live="polite">${askallDictFiltered().length} istilah ditemukan</p><div class="askall-dict-grid" id="askall-dict-results">${askallDictResults()}</div><div class="askall-dict-disclaimer">📚 <strong>Catatan akademik:</strong> Definisi ringkas ini untuk membantu belajar. Untuk tugas, laporan, dan skripsi, cocokkan dengan buku atau sumber ilmiah yang dapat diverifikasi. Kamus bukan panduan diagnosis atau terapi pasien.</div></main>`}
async function askallFetchDictionary(){if(!S.online||!S.client){S.dictError='Supabase belum tersambung';return}if(S.dictLoading)return;S.dictLoading=true;S.dictError='';try{const {data,error}=await S.client.from('askall_dictionary').select('id,term,category,definition,example,source_title,source_url,is_published,created_at').order('term',{ascending:true}).limit(500);if(error)throw error;S.dictionary=Array.isArray(data)?data:[];S.dictReady=true;}catch(e){S.dictError=String(e.message||e);S.dictReady=false;console.warn('ASKALL Dictionary:',e)}finally{S.dictLoading=false;if(!S.modal&&(S.page==='dictionary'||S.page==='admin'&&S.tab==='dictionary'))render()}}
function askallDictionaryAdmin(){if(!S.online||!S.client)return '<div class="alert warning">Sambungkan Supabase dan login admin untuk mengelola kamus.</div>';if(S.dictError)return `<div class="alert warning">${esc(S.dictError)} <button class="btn secondary small" data-act="dict-refresh">Coba lagi</button></div>`;if(!S.dictReady)return '<div class="alert">Memuat kamus... <button class="btn secondary small" data-act="dict-refresh">Muat ulang</button></div>';const current=S.dictionary.find(d=>d.id===S.dictEditId)||null;return `<div class="askall-dict-admin"><div class="panel"><h3>${current?'Edit istilah':'Tambah istilah baru'}</h3><p class="tiny">Hanya admin yang dapat mengubah data. Isi sumber setelah memeriksa buku atau referensi aslinya.</p><form id="askall-dict-form"><div class="fields2"><div class="field"><label>Istilah *</label><input name="term" required maxlength="140" value="${esc(current?.term||'')}" placeholder="Misal: Propriosepsi"></div><div class="field"><label>Bidang *</label><input name="category" required maxlength="65" value="${esc(current?.category||'Neurologi')}" list="askall-dict-categories" placeholder="Neurologi"><datalist id="askall-dict-categories">${[...new Set(S.dictionary.map(x=>x.category))].map(c=>`<option value="${esc(c)}"></option>`).join('')}</datalist></div></div><div class="field"><label>Definisi singkat *</label><textarea name="definition" required maxlength="1100" rows="3" placeholder="Tuliskan definisi faktual yang mudah dipahami">${esc(current?.definition||'')}</textarea></div><div class="field"><label>Contoh penggunaan</label><textarea name="example" maxlength="800" rows="2" placeholder="Contoh pada pemeriksaan atau pembelajaran">${esc(current?.example||'')}</textarea></div><div class="fields2"><div class="field"><label>Judul sumber (opsional)</label><input name="source_title" maxlength="260" value="${esc(current?.source_title||'')}" placeholder="Nama buku atau artikel"></div><div class="field"><label>Link sumber (opsional)</label><input name="source_url" type="url" maxlength="750" value="${esc(current?.source_url||'')}" placeholder="https://..."></div></div><label class="askall-dict-publish"><input type="checkbox" name="is_published" ${!current||current.is_published?'checked':''}> Tampilkan untuk semua pembaca</label><div class="askall-dict-formbuttons"><button type="submit" class="btn primary small">${current?'Simpan Perubahan':'Tambah Istilah'}</button>${current?'<button class="btn secondary small" type="button" data-act="dict-cancel">Batal Edit</button>':''}<button class="btn secondary small" type="button" data-act="dict-refresh">Segarkan</button></div></form></div><div class="panel"><h3>Daftar istilah (${S.dictionary.length})</h3><p class="tiny">${S.dictionary.filter(x=>x.is_published).length} terbit, ${S.dictionary.filter(x=>!x.is_published).length} draf. Batas tampilan 500 istilah.</p><div class="askall-dict-admin-list">${S.dictionary.map(x=>`<div class="askall-dict-admin-row"><div><strong>${esc(x.term)}</strong><small>${esc(x.category)} · ${x.is_published?'Terbit':'Draf'} ${x.source_title?'· Referensi tersedia':''}</small></div><div><button type="button" class="btn secondary small" data-act="dict-edit" data-id="${esc(x.id)}">Edit</button><button type="button" class="btn secondary small" data-act="dict-delete" data-id="${esc(x.id)}">Hapus</button></div></div>`).join('')||'<div class="alert">Belum ada istilah.</div>'}</div></div></div>`}
async function askallSaveDictionary(form){if(!S.admin||!S.online||!S.client){toast('Hanya admin online yang boleh menyimpan.');return}const data=new FormData(form),term=String(data.get('term')||'').trim(),category=String(data.get('category')||'').trim(),definition=String(data.get('definition')||'').trim(),example=String(data.get('example')||'').trim(),source_title=String(data.get('source_title')||'').trim(),source_url=String(data.get('source_url')||'').trim();if(!term||!category||!definition){toast('Istilah, bidang, dan definisi harus diisi.');return}if(source_url&&!url(source_url)){toast('Link sumber harus berupa URL http/https.');return}const payload={term:term.slice(0,140),category:category.slice(0,65),definition:definition.slice(0,1100),example:example.slice(0,800),source_title:source_title.slice(0,260),source_url:source_url.slice(0,750),is_published:data.get('is_published')==='on'};const button=form.querySelector('button[type="submit"]');if(button)button.disabled=true;try{const q=S.dictEditId?S.client.from('askall_dictionary').update(payload).eq('id',S.dictEditId):S.client.from('askall_dictionary').insert(payload);const {error}=await q;if(error)throw error;S.dictEditId=null;await askallFetchDictionary();toast('Istilah berhasil disimpan di Supabase.')}catch(e){toast('Gagal menyimpan istilah: '+String(e.message||e));if(button)button.disabled=false}}
async function askallDeleteDictionary(id){if(!S.admin||!S.online||!S.client){toast('Login admin terlebih dahulu.');return}const x=S.dictionary.find(d=>d.id===id);if(!x||!window.confirm(`Hapus istilah "${x.term}" dari kamus?`))return;try{const {error}=await S.client.from('askall_dictionary').delete().eq('id',id);if(error)throw error;if(S.dictEditId===id)S.dictEditId=null;await askallFetchDictionary();toast('Istilah dihapus dari kamus.')}catch(e){toast('Gagal menghapus: '+String(e.message||e))}}

 try{

 }catch(error){console.warn('ASKALL: audio panduan belum tersedia di browser ini.',error)}

function askallBodyAdmin(){if(!S.online||!S.client)return '<div class="alert warning">Login dengan akun admin Supabase untuk mengatur buku per bagian tubuh.</div>';const part=askallBodyPart(S.bodyAdminPart),mode=askallBodyMode(part.id),linked=S.bodyLinks.filter(x=>x.region_slug===part.id).sort((a,b)=>Number(a.sort_order)-Number(b.sort_order)),items=mode==='curated'?askallBodyRecs(part.id):askallBodyAuto(part.id),used=new Set(linked.map(x=>String(x.book_id)));const available=books().filter(x=>!used.has(String(x.id))).sort((a,b)=>a.title.localeCompare(b.title,'id'));return `<div class="askall-body-admin"><p class="askall-body-admin-guide">🧍 Pilih bagian tubuh dan tentukan buku dari koleksi yang sudah ada. Mode <b>Otomatis</b> berdasarkan metadata buku; mode <b>Kurasi Admin</b> menunjukkan hanya buku yang kamu pilih. Tidak perlu upload PDF baru.</p>${S.bodyError?`<div class="askall-body-notice">⚠ ${esc(S.bodyError)}. Jalankan SQL Body Explorer terlebih dahulu.</div>`:''}<div class="askall-body-admin-grid"><section class="askall-body-admin-card"><h3>Bagian Tubuh</h3><div class="field"><label for="askall-body-admin-region">Pilih area anatomi</label><select id="askall-body-admin-region">${ASKALL_BODY_PARTS.map(x=>`<option value="${x.id}" ${part.id===x.id?'selected':''}>${esc(x.name)} / ${esc(x.en)}</option>`).join('')}</select></div><div class="askall-body-admin-mode"><button type="button" data-act="body-mode" data-mode="auto" class="${mode==='auto'?'active':''}" ${S.bodyLoading||!!S.bodyError?'disabled':''}>🌱 Otomatis</button><button type="button" data-act="body-mode" data-mode="curated" class="${mode==='curated'?'active':''}" ${S.bodyLoading||!!S.bodyError?'disabled':''}>📌 Kurasi Admin</button></div><p class="askall-body-admin-warning">${mode==='auto'?'Buku tampil otomatis dari metadata, mungkin perlu pemeriksaan isi. Klik Kurasi Admin untuk menyimpan pilihan awal lalu mengeditnya.':'Hanya buku yang kamu pilih yang muncul untuk bagian tubuh ini. Pilihan tersimpan di Sup /* Sequence counter prevents queued old dialogue from speaking over newer scenes. */
let askallClinicVoiceToken=0;
let askallClinicVoiceTimer=null;
function askallClinicSilence(){
 askallClinicVoiceToken++;
 if(askallClinicVoiceTimer!==null){clearTimeout(askallClinicVoiceTimer);askallClinicVoiceTimer=null}
 try{window.speechSynthesis?.cancel()}catch{}
 document.querySelectorAll('.askall-clinic-chat.is-speaking').forEach(x=>x.classList.remove('is-speaking'));
}
function askallClinicSpeak(txt,delay){
 askallClinicSilence();
 if(!S.clinicVoiceOn||!txt||!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window))return;
 const token=askallClinicVoiceToken;
 // Wait until rendering and a browser paint occur, then give the scene a short visual lead-in.
 const sceneDelay=Number.isFinite(delay)?delay:(S.clinicScene===0?950:S.clinicScene===2?680:450);
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  if(token!==askallClinicVoiceToken||S.page!=='clinic')return;
  askallClinicVoiceTimer=setTimeout(()=>{
   askallClinicVoiceTimer=null;
   if(token!==askallClinicVoiceToken||S.page!=='clinic'||document.hidden||!document.querySelector('.askall-animated-room'))return;
   try{
    const u=new SpeechSynthesisUtterance(String(txt).slice(0,520));
    u.lang='id-ID';u.rate=.94;u.pitch=1.04;u.volume=.82;
    const voices=window.speechSynthesis.getVoices();
    const v=voices.find(v=>/^id[-_]/i.test(v.lang))||voices.find(v=>/^id/i.test(v.lang));
    if(v)u.voice=v;
    u.onstart=()=>{if(token===askallClinicVoiceToken)document.querySelector('.askall-clinic-chat')?.classList.add('is-speaking')};
    const cleanup=()=>document.querySelector('.askall-clinic-chat.is-speaking')?.classList.remove('is-speaking');
    u.onend=cleanup;u.onerror=cleanup;
    if(token===askallClinicVoiceToken)window.speechSynthesis.speak(u);
   }catch(e){console.warn('Suara Klinik Virtual tidak tersedia:',e)}
  },sceneDelay);
 }));
}

 if(S.clinicScene<3)return [sc.arrival,sc.dialogue,'Ini surat rujukan dari dokter rehabilitasi. Mohon diperiksa ulang.'][S.clinicScene]||c.summary;

d.has(String(b.id)));return `<form class="askall-clinic-admin" id="askall-clinic-form"><div class="askall-clinic-admin-card"><h3>${already?'Edit Kasus':'Buat Kasus Baru'}</h3><div class="askall-clinic-admin-grid">${input('slug',c.slug,'ID kasus (tidak bisa diubah setelah dibuat)',true)}${input('title',c.title,'Judul kasus',true)}${input('specialty',c.specialty,'Bidang')}${input('patient',c.patient,'Identitas pasien FIKTIF')}${input('related_terms',c.related_terms,'Kata kunci buku, pisahkan koma')}${input('sort_order',String(c.sort_order??0),'Urutan tampil')}</div><div class="askall-clinic-admin-grid"><div><label>Tingkat kesulitan</label><select name="difficulty">${['Dasar','Menengah','Lanjutan'].map(v=>`<option ${v===c.difficulty?'selected':''}>${v}</option>`).join('')}</select></div><div><label>Publikasi</label><select name="is_published"><option value="false" ${!c.is_published?'selected':''}>Draft (hanya admin)</option><option value="true" ${c.is_published?'selected':''}>Publikasikan</option></select></div></div>${area('summary',c.summary,'Ringkasan kasus')}${area('story',c.story,'Cerita pasien fiktif')}${area('arrival',sc.arrival,'Suara saat pasien datang')}${area('dialogue',sc.dialogue,'Cerita pasien saat mengobrol')}${area('referral',sc.referral,'Diagnosis pada surat dokter (SIMULASI)')}${area('bedside',sc.bedside,'Penjelasan saat pasien baring / diperiksa')}${area('redflags',sc.redflags,'Catatan keselamatan dan tanda bahaya')}${area('debrief',sc.debrief,'Pembahasan akhir')}</div><div class="askall-clinic-admin-card"><p class="askall-clinic-inline-help">Semua tahap di bawah dapat diedit. Untuk 5 kasus bawaan, tersedia enam tahap. Surat dokter hanya simulasi pendidikan.</p><input type="hidden" name="stage_count" value="${stages.length}"></div>${stageHtml}<div class="askall-clinic-cta"><button type="submit" class="askall-clinic-next" ${S.clinicSaving?'disabled':''}>${S.clinicSaving?'Menyimpan…':'Simpan Kasus ke Supabase'}</button><button type="button" class="aska async function askallClinicSave(form){if(!S.admin||!S.online||!S.client||S.clinicSaving)return;const v=Object.fromEntries(new FormData(form).entries());const slug=String(v.slug||'').trim();if(!/^[a-z0-9][a-z0-9-]{2,69}$/.test(slug)){toast('ID kasus harus berupa huruf kecil, angka, atau tanda - (3–70 karakter).');return}const old=S.clinicCases.find(x=>x.slug===slug);if(S.clinicAdminSlug!== '__new__'&&!old){toast('Kasus tidak ditemukan. Muat ulang.');return}const original=S.clinicCases.find(x=>x.slug===slug);const existingScenario=original?.scenario||{};const stageCount=Math.min(12,Math.max(1,Number(v.stage_count)||3));const stages=Array.from({length:stageCount},(_,i)=>{const correct=Number(v['stage_'+i+'_correct']);return {label:String(v['stage_'+i+'_label']||'').trim(),scene:['talk','exam','bed','treat','exercise'].includes(v['stage_'+i+'_scene'])?v['stage_'+i+'_scene']:'talk',dialogue:String(v['stage_'+i+'_dialogue']||'').trim(),question:String(v['stage_'+i+'_question']||'').trim(),findings:String(v['stage_'+i+'_findings']||'').trim(),options:[0,1,2].map(j=>({label:String(v['stage_'+i+'_opt_'+j]||'').trim(),feedback:String(v['stage_'+i+'_feedback_'+j]||'').trim(),correct:j===correct}))}});if(stages.some(s=>!s.question||s.options.some(o=>!o.label||!o.feedback))){toast('Lengkapi seluruh pertanyaan, opsi, dan pembahasan sebelum menyimpan.');return}const record={slug,title:String(v.title||'').trim(),specialty:String(v.specialty||'').trim(),difficulty:v.difficulty,patient:String(v.patient||'').trim(),summary:String(v.summary||'').trim(),story:String(v.story||'').trim(),related_terms:String(v.related_terms||'').trim(),sort_order:Math.max(0,Number(v.sort_order)||0),is_published:v.is_published==='true',scenario:{...existingScenario,arrival:String(v.arrival||'').trim(),dialogue:String(v.dialogue||'').trim(),referral:String(v.referral||'').trim(),bedside:String(v.bedside||'').trim(),redflags:String(v.redflags||'').trim(),debrief:String(v.debrief||'').trim(),stages}};if(!record.title||!record.story){toast('Judul dan cerita kasus wajib diisi.');return}S.clinicSaving=true;try{const {error}=await S.client.from('askall_clinic_cases').upsert(record,{onConflict:'slug'});if(error)throw error;S.clinicAdminSlug=slug;await askallClinicFetch();toast('Kasus klinik berhasil disimpan.')}catch(e){toast('Gagal menyimpan: '+e.message);console.warn(e)}finally{S.clinicSaving=false;render()}}

const ASKALL_FEEDBACK_KIND={saran:'Saran & ide',permintaan_buku:'Permintaan buku',laporan_masalah:'Laporan masalah'};
const ASKALL_FEEDBACK_STATUS={baru:'Baru',dibaca:'Dibaca',selesai:'Selesai'};
async function askallLoadFeedback(){
 if(!S.admin||!S.online||!S.client){S.feedbackError='Login admin online diperlukan untuk membaca pesan.';S.feedbackItems=[];return;}
 S.feedbackLoading=true;S.feedbackError='';
 try{
   const {data,error}=await S.client.from('askall_feedback').select('id,jenis,nama,pesan,status,dibuat_pada').order('dibuat_pada',{ascending:false}).limit(200);
   if(error)throw error;
   S.feedbackItems=Array.isArray(data)?data:[];
 }catch(e){S.feedbackError=String(e.message||e);S.feedbackItems=[];}
 finally{S.feedbackLoading=false;}
}
function dashFeedback(){
 if(!S.online)return `<div class="askall-feedback-alert">Masuk melalui akun admin Supabase agar saran pembaca dapat dikelola secara online.</div>`;
 const all=S.feedbackItems||[];
 const list=all.filter(x=>S.feedbackFilter==='all'||x.status===S.feedbackFilter);
 return `<div class="askall-feedback-admin"><div class="askall-feedback-alert">📬 Hanya admin terdaftar yang dapat melihat pesan. Menampilkan hingga 200 pesan terbaru. Jangan membagikan data pribadi pembaca.</div><div class="dashboard-stats"><div class="statbox"><small>Pesan diterima</small><strong>${all.length}</strong></div><div class="statbox"><small>Baru</small><strong>${all.filter(x=>x.status==='baru').length}</strong></div><div class="statbox"><small>Selesai</small><strong>${all.filter(x=>x.status==='selesai').length}</strong></div></div><div class="panel"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><div><h3>Pesan masuk</h3><p class="tiny">Saran pembaca, permintaan buku, dan laporan masalah.</p></div><div class="askall-feedback-controls"><select id="askall-feedback-filter" aria-label="Filter status"><option value="all" ${S.feedbackFilter==='all'?'selected':''}>Semua status</option><option value="baru" ${S.feedbackFilter==='baru'?'selected':''}>Baru</option><option value="dibaca" ${S.feedbackFilter==='dibaca'?'selected':''}>Dibaca</option><option value="selesai" ${S.feedbackFilter==='selesai'?'selected':''}>Selesai</option></select><button class="btn secondary small" type="button" data-act="feedback-refresh" ${S.feedbackLoading?'disabled':''}>${el('refresh',14)} Muat Ulang</button></div></div>${S.feedbackLoading?'<p class="tiny">Memuat pesan...</p>':S.feedbackError?`<p class="askall-feedback-alert">Gagal memuat pesan: ${esc(S.feedbackError)}</p>`:list.length?list.map(x=>`<article class="askall-feedback-card"><div class="askall-feedback-card-top"><span class="askall-feedback-tag">${esc(ASKALL_FEEDBACK_KIND[x.jenis]||x.jenis)}</span><span class="askall-feedback-meta">${esc(x.nama||'Pembaca ASKALL')} · ${esc(askallFeedbackDate(x.dibuat_pada))}</span></div><p class="askall-feedback-message">${esc(x.pesan)}</p><div class="askall-feedback-controls"><label class="tiny" for="feedback-status-${esc(x.id)}">Status:</label><select id="feedback-status-${esc(x.id)}" data-feedback-id="${esc(x.id)}" aria-label="Status pesan"><option value="baru" ${x.status==='baru'?'selected':''}>Baru</option><option value="dibaca" ${x.status==='dibaca'?'selected':''}>Dibaca</option><option value="selesai" ${x.status==='selesai'?'selected':''}>Selesai</option></select><button class="btn danger small" type="button" data-act="feedback-delete" data-id="${esc(x.id)}">${el('trash',13)} Hapus</button></div></article>`).join(''):'<p class="tiny" style="padding:22px 0">Belum ada pesan pada status ini.</p>'}</div></div>`;
}
function askallFeedbackDate(raw){try{return new Intl.DateTimeFormat('id-ID',{dateStyle:'medium',timeStyle:'short'}).format(new Date(raw))}catch{return 'Tanggal tidak diketahui'}}
async function askallSendFeedback(form){
 const btn=form.querySelector('button[type="submit"]');
 if(!S.online||!S.client){toast('Koneksi Supabase tidak tersedia. Coba muat ulang website.');return;}
 const v=Object.fromEntries(new FormData(form).entries());
 if(String(v.website||'').trim())return;
 const jenis=String(v.jenis||'saran');const nama=String(v.nama||'').trim()||'Pembaca ASKALL';const pesan=String(v.pesan||'').trim();
 if(!Object.hasOwn(ASKALL_FEEDBACK_KIND,jenis)||nama.length>60||pesan.length<5||pesan.length>1000){toast('Periksa kembali jenis, nama, dan panjang pesan.');return;}
 const last=Number(localStorage.getItem('askall-feedback-last-sent')||0);
 if(Date.now()-last<60000){toast('Pesan sebelumnya sudah terkirim. Coba lagi setelah satu menit.');return;}
 if(btn){btn.disabled=true;btn.textContent='Mengirim pesan...';}
 try{
   const {error}=await S.client.from('askall_feedback').insert({jenis,nama,pesan});
   if(error)throw error;
   localStorage.setItem('askall-feedback-last-sent',String(Date.now()));
   form.reset();toast('Terima kasih! Pesanmu sudah diterima ASKALL. 💚');
 }catch(e){toast('Pesan gagal dikirim: '+String(e.message||e));}
 finally{if(btn){btn.disabled=false;btn.textContent='💚 Kirim Pesan';}}
}
async function askallChangeFeedbackStatus(id,status){
 if(!S.admin||!['baru','dibaca','selesai'].includes(status))return;
 const item=S.feedbackItems.find(x=>x.id===id);if(!item)return;
 const old=item.status;item.status=status;
 const {error}=await S.client.from('askall_feedback').update({status}).eq('id',id);
 if(error){item.status=old;toast('Gagal mengubah status: '+error.message)}else toast('Status pesan diperbarui.');
 render();
}
async function askallDeleteFeedback(id){
 if(!S.admin||!confirm('Hapus pesan ini secara permanen?'))return;
 const {error}=await S.client.from('askall_feedback').delete().eq('id',id);
 if(error){toast('Gagal menghapus pesan: '+error.message);return;}
 S.feedbackItems=S.feedbackItems.filter(x=>x.id!==id);render();toast('Pesan berhasil dihapus.');
}

else if(S.modal==='login'){html=`<div class="modal narrow"><button class="close" data-act="close">${el('x',18)}</button><div class="modal-content"><span class="eyebrow">ASKALL CONTENT STUDIO</span><h2 class="serif">Hello, creator.</h2><p>${S.online?'Masuk menggunakan akun admin Supabase. Pengunjung tidak bisa mengubah koleksi.':'Masukkan kata sandi untuk mencoba dashboard lokal.'}</p><form id="login-form">${S.online?`<div class="field"><label>Email admin</label><input name="email" type="email" autocomplete="username" required placeholder="email adminmu"></div>`:''}<div class="field"><label>Kata sandi</label><input name="password" type="password" autocomplete="${S.online?'current-password':'off'}" required placeholder="Kata sandi admin"></div><button type="submit" class="btn primary full">${el('lock',16)} Buka Dashboard</button></form><p class="tiny" style="margin-top:14px">${S.online?'Akses edit dilindungi Supabase Auth dan Row Level Security.':'ASKALL123 adalah kunci demo. Jangan menganggap kunci dalam HTML sebagai sistem keamanan untuk situs publik.'}</p></div></div>`}
else if(S.modal==='book'){const b=S.editBook||{title:'',author:'',year:'',category_id:cats()[0]?.id||'',description:'',tag:'KOLEKSI',color:'#477a6b',cover_url:'',file_path:'',size:0};html=`<div class="modal"><button class="close" data-act="close">${el('x',18)}</button><div class="modal-content"><span class="eyebrow">ASKALL / BOOK EDITOR</span><h2 class="serif">${S.editBook?'Edit koleksi':'Buku baru, harapan baru.'}</h2><form id="book-form"><div class="fields2"><div class="field"><label>Judul buku *</label><input name="title" required value="${esc(b.title)}" maxlength="150"></div><div class="field"><label>Penulis / penerbit</label><input name="author" value="${esc(b.author)}" maxlength="120"></div></div><div class="fields2"><div class="field"><label>Kategori</label><select name="category_id" required>${cats().map(c=>`<option value="${esc(c.id)}" ${b.category_id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Tahun terbit</label><input name="year" value="${esc(b.year)}" maxlength="12"></div></div><div class="askall-cite-editor-title">✦ Metadata untuk Sitasi APA 7</div><p class="askall-cite-editor-hint">Isi sesuai halaman identitas buku, bukan tebakannya. Pisahkan nama beberapa penulis dengan titik koma (;). Edisi pertama boleh dikosongkan.</p><div class="fields2"><div class="field"><label>Penerbit buku</label><input name="publisher" value="${esc(b.publisher||'')}" maxlength="200" placeholder="Contoh: Elsevier"></div><div class="field"><label>Edisi (jika bukan pertama)</label><input name="edition" value="${esc(b.edition||'')}" maxlength="50" placeholder="Contoh: 6"></div></div><div class="fields2"><div class="field"><label>DOI (jika tersedia)</label><input name="doi" value="${esc(b.doi||'')}" maxlength="250" placeholder="10.1000/xyz123"></div><div class="field"><label>ISBN (opsional)</label><input name="isbn" value="${esc(b.isbn||'')}" maxlength="80" placeholder="978-..."></div></div><div class="field"><label>Deskripsi< else if(S.modal==='category'){const c=S.editCat||{name:'',icon:'brain',tone:'#e4eee3'};html=`<div class="modal narrow"><button class="close" data-act="close">${el('x',18)}</button><div class="modal-content"><span class="eyebrow">ASKALL / CATEGORY DESIGNER</span><h2 class="serif">${S.editCat?'Edit kategori':'Buat ruang ilmu baru.'}</h2><form id="cat-form"><div class="field"><label>Nama kategori *</label><input name="name" required minlength="2" maxlength="42" value="${esc(c.name)}" placeholder="Misalnya: Pediatri"></div><div class="field"><label>Pilih ikon favoritmu</label><input type="hidden" name="icon" id="cat-icon-value" value="${esc(c.icon)}"><div id="cat-icons">${iconPicker(c.icon,'cat-icon')}</div></div><div class="field"><label>Warna kartu kategori</label><input type="color" name="tone" value="${esc(c.tone)}"></div><div class="form-footer"><button type="button" class="btn secondary" data-act="close">Batal</button><button type="submit" class="btn primary">${el('check',16)} Simpan kategori</button></div></form></div></div>`}

function checkAdmin(){if(S.admin)return true;showModal('login');toast('Masuk admin terlebih dahulu.');return false}
function storeLocalAsset(key,blob){return new Promise((resolve,reject)=>{const rq=indexedDB.open('askall-library-assets',1);rq.onupgradeneeded=()=>{if(!rq.result.objectStoreNames.contains('assets'))rq.result.createObjectStore('assets')};rq.onerror=()=>reject(rq.error);rq.onsuccess=()=>{const db=rq.result;const t=db.transaction('assets','readwrite');t.objectStore('assets').put(blob,key);t.oncomplete=()=>{db.close();resolve()};t.onerror=()=>reject(t.error)}})}
function getLocalAsset(key){return new Promise((resolve,reject)=>{const rq=indexedDB.open('askall-library-assets',1);rq.onupgradeneeded=()=>{if(!rq.result.objectStoreNames.contains('assets'))rq.result.createObjectStore('assets')};rq.onerror=()=>reject(rq.error);rq.onsuccess=()=>{const db=rq.result;const t=db.transaction('assets','readonly');const g=t.objectStore('assets').get(key);g.onsuccess=()=>{resolve(g.result);db.close()};g.onerror=()=>reject(g.error)}})}
function deleteLocalAsset(key){return new Promise(resolve=>{const rq=indexedDB.open('askall-library-assets',1);rq.onupgradeneeded=()=>{if(!rq.result.objectStoreNames.contains('assets'))rq.result.createObjectStore('assets')};rq.onsuccess=()=>{const db=rq.result;const t=db.transaction('assets','readwrite');t.objectStore('assets').delete(key);t.oncomplete=()=>{db.close();resolve()};t.onerror=()=>{db.close();resolve()}};rq.onerror=()=>resolve()})}
function fileValid(file){return file&&(file.type==='application/pdf'||/\.pdf$/i.test(file.name))&&file.size>0&&file.size<=50*1024*1024}
async function shrink(file,width=740){return new Promise((resolve,reject)=>{if(!/^image\/(png|jpeg|webp)$/.test(file.type))return reject(Error('Gunakan JPG, PNG, atau WebP.'));const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{const scale=Math.min(1,width/Math.max(im.width,im.height));const canvas=document.createElement('canvas');canvas.width=Math.round(im.width*scale);canvas.height=Math.round(im.height*scale);canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);canvas.toBlob(blob=>blob?resolve(blob):reject(Error('Gambar tidak dapat disimpan.')),'image/webp',.76)};im.onerror=()=>reject(Error('Gambar tidak bisa dibuka.'));im.src=reader.result};reader.onerror=()=>reject(Error('Gambar gagal dibaca.'));reader.readAsDataURL(file)})}
const blobToData=blob=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(blob)});
async function uploadAsset(file,prefix){if(!S.online)throw Error('Cloud belum aktif.');const path=`${prefix}/${uid()}.${prefix==='pdf'?'pdf':'webp'}`;const {error}=await S.client.storage.from('askall-library').upload(path,file,{contentType:prefix==='pdf'?'application/pdf':'image/webp',upsert:false,cacheControl:'3600'});if(error)throw error;return path}
const publicAsset=path=>{if(!path)return '';if(!S.client)return '';return S.client.storage.from('askall-library').getPublicUrl(path).data.publicUrl};
async function saveRecord(table,data){if(S.online){const {error}=await S.client.from(table).upsert(data);if(error)throw error}else{if(table==='askall_books'){S.books=[data,...books().filter(b=>b.id!==data.id)];}if(table==='askall_categories'){S.cats=[...cats().filter(c=>c.id!==data.id),data]};if(table==='askall_site'){S.settings=data.data};writeLocal()}}
async function removeRecord(table,id){if(S.online){const {error}=await S.client.from(table).delete().eq('id',id);if(error)throw error}else{if(table==='askall_books')S.books=books().filter(b=>b.id!==id);if(table==='askall_categories')S.cats=cats().filter(c=>c.id!==id);writeLocal()}}
function showLoading(value,text='Mengunggah...'){S.uploading=value;const btn=document.getElementById('book-save');if(btn)btn.disabled=value;const p=document.getElementById('upload-progress');if(p)p.classList.toggle('hide',!value);const status=document.getElementById('upload-status');if(status)status.textContent=text;const percent=document.getElementById('upload-percent');if(percent)percent.style.width=value?'65%':'0%'}
async function persistBook(form){if(!checkAdmin()||S.uploading)return;const v=Object.fromEntries(new FormData(form).entries());const b=S.editBook;const id=b?.id||uid();const book={id,title:String(v.title).trim(),author:String(v.author).trim(),category_id:String(v.category_id),description:String(v.description).trim(),year:String(v.year).trim(),publisher:String(v.publisher||'').trim(),edition:String(v.edition||'').trim(),doi:String(v.doi||'').trim(),isbn:String(v.isbn||'').trim(),tag:String(v.tag||'KOLEKSI').trim(),color:String(v.color),cover_url:b?.cover_url||'',file_path:b?.file_path||'',size:b?.size||0,created_at:b?.created_at||new Date().toISOString()};if(!book.title){toast('Judul tidak boleh kosong.');return}if(!cats().some(c=>c.id===book.category_id)){toast('Pilih kategori yang tersedia.');return}
 const files=[];showLoading(true);try{

 if(S.selectedCover){const shrunk=await shrink(S.selectedCover,800);if(S.online){const coverPath=await uploadAsset(shrunk,'covers');book.cover_url=publicAsset(coverPath);files.push(coverPath)}else{book.cover_url=await blobToData(shrunk)}}
 await saveRecord('askall_books',book);
 if(S.online){if(b?.file_path&&S.selectedFile&&b.file_path!==book.file_path){await S.client.storage.from('askall-library').remove([b.file_path])}if(b?.cover_url&&S.selectedCover&&b.cover_url.includes('/storage/v1/object/public/')){const oldpath=b.cover_url.split('/storage/v1/object/public/askall-library/')[1];if(oldpath)await S.client.storage.from('askall-library').remove([decodeURIComponent(oldpath)])}}
 else if(b?.file_path&&S.selectedFile&&b.file_path!==book.file_path)await deleteLocalAsset(b.file_path);
 if(S.online)await loadCloud();closeModal();render();toast('Buku berhasil disimpan'+(S.online?' dan tersedia untuk pengunjung.':'.'));
 }catch(e){toast('Gagal menyimpan: '+e.message);if(S.online&&files.length){const unused=files.filter(p=>!p.startsWith('http'));if(unused.length)await S.client.storage.from('askall-library').remove(unused)}}finally{showLoading(false)}}
async function persistCategory(form){if(!checkAdmin())return;const v=Object.fromEntries(new FormData(form).entries());const name=String(v.name||'').trim().replace(/\s+/g,' ');if(!name){toast('Isi nama kategori.');return}if(cats().some(c=>c.id!==S.editCat?.id&&c.name.toLowerCase()===name.toLowerCase())){toast('Kategori sudah ada.');return}const data={id:S.editCat?.id||uid(),name,icon:ICONS[v.icon]?v.icon:'book',tone:/^#[0-9a-f]{6}$/i.test(v.tone)?v.tone:'#e4eee3'};try{await saveRecord('askall_categories',data);if(S.online)await loadCloud();closeModal();render();toast('Kategori dan ikon tersimpan.')}catch(e){toast('Gagal menyimpan kategori: '+e.message)}}
async function encodeQRIS(file){if(!/^image\/(png|jpeg|webp)$/.test(file?.type||''))throw Error('Pilih gambar QRIS PNG, JPG, atau WebP.');if(file.size>10*1024*1024)throw Error('Ukuran gambar QRIS maksimal 10 MB.');return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const scale=Math.min(1,1200/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?resolve(b):reject(Error('QRIS gagal diproses.')),'image/webp',1)};im.onerror=()=>reject(Error('Gambar QRIS tidak terbaca.'));im.src=r.result};r.onerror=()=>reject(Error('Gambar gagal dimuat.'));r.readAsDataURL(file)})}
async function persistDonation(form){if(!checkAdmin())return;const pickedQRIS=form.querySelector('#qris-file')?.files?.[0];if(pickedQRIS){S.selectedQRIS=pickedQRIS;S.clearQRIS=false}const v=Object.fromEntries(new FormData(form).entries());const next={...site(),donationEnabled:v.donationEnabled==='on',donationTitle:String(v.donationTitle||'').trim().slice(0,100),donationText:String(v.donationText||'').trim().slice(0,500)};let newPath='';try{if(S.clearQRIS)next.donationImage='';if(S.selectedQRIS){const img=await encodeQRIS(S.selectedQRIS);if(S.online){newPath=await uploadAsset(img,'qris');next.donationImage=publicAsset(newPath)}else{next.donationImage=await blobToData(img)}}if(next.donationEnabled&&!next.donationImage){toast('Unggah gambar QRIS dahulu, atau nonaktifkan kartu dukungan.');if(newPath)await S.client.storage.from('askall-library').remove([newPath]);return}await saveRecord('askall_site',{id:1,data:next});S.settings=next;if(S.online)await loadCloud();S.selectedQRIS=null;S.clearQRIS=false;render();toast('Pengaturan dukungan ASKALL berhasil disimpan.')}catch(e){toast('Gagal menyimpan donasi: '+e.message);if(S.online&&newPath)await S.client.storage.from('askall-library').remove([newPath])}}
async function persistGallery(form){
 if(!checkAdmin())return;
 const submit=form.querySelector('#gallery-save');if(submit){submit.disabled=true;submit.textContent='Menyimpan foto...'}
 const current=Array.from({length:4},(_,i)=>galleryPhotos()[i]||{src:'',caption:''});
 const next={...site(),gallery:current.map(x=>({...x}))};
 const uploaded=[];
 try{
   for(let i=0;i<4;i++){
     const remove=form.elements.namedItem('galleryRemove'+i)?.checked;
     const caption=String(form.elements.namedItem('galleryCaption'+i)?.value||'').trim().slice(0,45);
     const file=form.elements.namedItem('galleryUpload'+i)?.files?.[0];
     if(remove){next.gallery[i]={src:'',caption:''};continue}
     let src=next.gallery[i].src||'';
     if(file){
       if(file.size>12*1024*1024)throw Error('Foto '+(i+1)+' lebih dari 12 MB.');
       const resized=await shrink(file,720);
       if(S.online){const path=await uploadAsset(resized,'images');uploaded.push(path);src=publicAsset(path)}
       else src=await blobToData(resized);
     }
     next.gallery[i]={src,caption};
   }
   await saveRecord('askall_site',{id:1,data:next});
   S.settings=next;
   if(S.online)await loadCloud();
   render();toast('Galeri beranda berhasil diperbarui.');
 }catch(err){
   if(S.online&&uploaded.length)await S.client.storage.from('askall-library').remove(uploaded).catch(()=>{});
   if(submit){submit.disabled=false;submit.textContent='Simpan foto beranda'}
   toast('Gagal menyimpan foto: '+err.message);
 }
}

async function loadCloud(){if(!S.online)return;const [br,cr,sr]=await Promise.all([S.client.from('askall_books').select('*').order('created_at',{ascending:false}),S.client.from('askall_categories').select('*').order('name'),S.client.from('askall_site').select('*').eq('id',1).maybeSingle()]);for(const r of [br,cr,sr])if(r.error)throw r.error;S.books=br.data||[];S.cats=cr.data||[];S.settings={...SET,...(sr.data?.data||{})};S.initialized=true;if(!S.modal&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName||''))render()}

<script>
/* Navigasi scroll: tidak mengubah Supabase, buku, atau sistem dashboard. */
(() => {
  'use strict';
  let lastY = Math.max(0, window.scrollY || 0);
  let queued = false;
  let downTravel = 0;
  let upTravel = 0;
  const body = document.body;
  const update = () => {
    queued = false;
    const y = Math.max(0, window.scrollY || document.documentElement.scrollTop || 0);
    const dy = y - lastY;
    lastY = y;
    if (y < 120) {
      body.classList.remove('askall-nav-hidden');
      downTravel = 0;
      upTravel = 0;
      return;
    }
    if (Math.abs(dy) < 1) return;
    // Jangan sembunyikan navbar ketika pengguna sedang berinteraksi dengannya.
    const focusedInNav = document.activeElement?.closest?.('.header');
    if (focusedInNav) {
      body.classList.remove('askall-nav-hidden');
      return;
    }
    if (dy > 0) {
      downTravel += dy;
      upTravel = 0;
      if (downTravel > 24) body.classList.add('askall-nav-hidden');
    } else {
      upTravel -= dy;
      downTravel = 0;
      if (upTravel > 12) body.classList.remove('askall-nav-hidden');
    }
  };
  window.addEventListener('scroll', () => {
    if (!queued) {
      queued = true;
      window.requestAnimationFrame(update);
    }
  }, {passive:true});
  document.addEventListener('focusin', (ev) => {
    if (ev.target?.closest?.('.header')) body.classList.remove('askall-nav-hidden');
  });
  window.addEventListener('pageshow', () => {
    lastY = Math.max(0, window.scrollY || 0);
    if (lastY < 120) body.classList.remove('askall-nav-hidden');
  });
})();
</script>
