
<!-- YOTA CAFE INTERIOR | ASKALL FINAL CHAPTER -->
<style id="yota-cafe-interior-v1">
body.yota-journal-open {
  background: #f8ecdc !important;
}
.yota-journal {
  background:
    radial-gradient(ellipse at 85% 6%, #fff7db 0%, transparent 40%),
    linear-gradient(180deg,#fff5e8 0%,#f5e5d2 100%);
  color: #594537;
}
.yota-journal-top {
  background: #fff6ebf2;
  border-bottom: 1px solid #e9d4bc;
}
.yota-journal-top span,
.yota-journal-top small {
  color: #865f47;
}
.yota-journal-top button {
  color: #78513a;
  border-color: #e4cdb7;
}
.yota-journal-wrap {
  max-width: 1120px;
}
.yota-cafe-scene {
  position: relative;
  min-height: 220px;
  margin: 0 0 20px;
  border-radius: 26px;
  overflow: hidden;
  background:
    linear-gradient(90deg,
      #d2bca4 0 9%,
      transparent 9% 91%,
      #d2bca4 91%),

.yota-cafe-scene:before {
  content: "";
  position: absolute;
  left: 50%;
  top: 0;
  width: 9px;
  height: 100%;
  background: #fff8ec;
  box-shadow: 0 105px 0 0 #fff8ec;
}
.yota-cafe-scene:after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: 9px;
  background: #fff8ec;
}
.yota-cafe-furnish {
  position: relative;
  margin-top: -76px;

  pointer-events: none;
  z-index: 2;
}
.yota-cafe-table {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  width: min(340px,80%);
  min-height: 70px;
  border: 6px solid #b98b63;
  border-radius: 55% 55% 24px 24px;
  background: linear-gradient(#f3d9b5,#c99b75);
  box-shadow: 0 18px 0 -10px #956b50,
    0 23px 24px #99775c38;
  font-size: 35px;
  letter-spacing: 12px;
}
.yota-cafe-lamps {
  position: absolute;
  left: 0;
  right: 0;
  top: 7px;
  display: flex;
  justify-content: space-around;
  font-size: 31px;
}
.yota-journal-hero {
  background: #fffaf2e8;
  border: 1px solid #e9d4bd;
  box-shadow: 0 12px 30px #a9825920;
}
.yota-journal-hero h1 {
  color: #79563f;
}
.yota-journal-hero h1 em {
  color: #b88a70;
}
.yota-journal-hero p {
  color: #85705f;
}
.yota-kicker {
  color: #a57854;
}
.yota-board {
  background: #604a36;
  color: #fff7e9;
  box-shadow: 0 10px 25px #5c453333;
}
.yota-search-box {
  background: #fffcf7;
  border: 1px solid #e8d7c3;

}
.yota-box-title strong,
.yota-results-title h2 {

}

  background: #faf0e2;
  border-color: #e6d2bb;
  color: #765743;
}
.yota-scope-options input:checked + span {
  background: #a6784c;
  border-color: #a6784c;
  color: white;
}
.yota-search-line button,
.yota-more {
  background: #93663f;
  color: white;
}
.yota-topics button,
.yota-paper-actions a,
.yota-paper-actions button {
  background: #fff2df;
  border-color: #ead6be;
  color: #815b3d;
}
.yota-paper {
  background: #fffdf8;
  border-color: #e9d8c4;

.yota-paper h3 {

}
.yota-paper-meta,
.yota-results-title p {

  .yota-cafe-scene {
    min-height: 160px;
    border-radius: 18px;
  }
  .yota-cafe-furnish {
    margin-top: -56px;
    margin-bottom: 16px;

  .yota-cafe-table {

<script id="yota-cafe-decor-v1">
(function () {
  const hero = document.querySelector(
    "#yota-journal .yota-journal-hero"
  );
  if (!hero || document.querySelector(".yota-cafe-scene")) {
    return;
  }
  hero.insertAdjacentHTML("beforebegin", `
    <div class="yota-cafe-scene" aria-hidden="true">
      <div class="yota-cafe-lamps">💡 ✨ 💡</div>
    </div>
    <div class="yota-cafe-furnish" aria-hidden="true">
      <div class="yota-cafe-table">🧋 📖 ☕</div>
    </div>
  `);
})();
</script>
